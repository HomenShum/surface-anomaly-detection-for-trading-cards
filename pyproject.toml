[project]
name = "card-condition-vault"
version = "0.1.0"
description = "Local-first trading-card condition scanner, DING detector, and evidence vault."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "python-multipart>=0.0.9",
  "pillow>=10.0.0",
  "numpy>=1.26.0",
  "opencv-python>=4.9.0",
]

[project.optional-dependencies]
ml = [
  "torch>=2.2.0",
  "ultralytics>=8.3.0",
  "anomalib>=2.0.0",
]
test = [
  "pytest>=8.2.0",
  "httpx>=0.27.0",
]
ocr = [
  "pytesseract>=0.3.10",
]

[tool.pytest.ini_options]
pythonpath = [
  "services/inference-api",
  "."
]
testpaths = [
  "services/inference-api/tests",
  "ml/tests",
  "tests/datasets"
]
